<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播工资记账工具</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="p-4 md:p-8">
    <!-- Toast Notification Container -->
    <div id="toastContainer"></div>
    
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8 animate-slide-in">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 text-shadow-header">
                💰 直播工资记账工具
            </h1>
            <p class="text-white/90 text-lg">中控专用 - 智能计算主播工资</p>
        </div>

        <!-- Supabase Configuration Panel -->
        <div class="card p-6 mb-6 animate-slide-in delay-100">
            <button type="button" id="toggleConfigBtn" class="w-full flex justify-between items-center text-left cursor-pointer hover:opacity-80 transition-opacity">
                <h2 class="text-xl font-semibold text-gray-800">⚙️ Supabase 配置</h2>
                <span id="configToggle" class="text-2xl select-none">▼</span>
            </button>
            <div id="configPanel" class="config-panel mt-4">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Supabase URL</label>
                        <input type="text" id="supabaseUrl" 
                               placeholder="https://你的项目id.supabase.co"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Supabase Anon Key</label>
                        <input type="text" id="supabaseKey" 
                               placeholder="你的 anon public key"
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                    </div>
                    <button type="button" id="saveConfigBtn"
                            class="btn w-full bg-gradient-to-r from-purple-500 to-indigo-600 text-white py-3 rounded-lg hover:from-purple-600 hover:to-indigo-700 cursor-pointer">
                        💾 保存配置
                    </button>
                </div>
            </div>
        </div>

        <!-- Anchor Management Panel -->
        <div class="card p-6 mb-6 animate-slide-in delay-150">
            <button type="button" id="toggleAnchorBtn" class="w-full flex justify-between items-center text-left cursor-pointer hover:opacity-80 transition-opacity">
                <h2 class="text-xl font-semibold text-gray-800">🎤 主播管理</h2>
                <span id="anchorToggle" class="text-2xl select-none">▼</span>
            </button>
            <div id="anchorPanel" class="config-panel mt-4">
                <div class="flex gap-2 mb-4">
                    <input type="text" id="anchorNameInput" placeholder="输入主播名称"
                           class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                    <button type="button" id="addAnchorBtn"
                            class="btn px-6 py-2 bg-gradient-to-r from-purple-500 to-indigo-600 text-white rounded-lg hover:from-purple-600 hover:to-indigo-700 cursor-pointer">
                        ➕ 添加
                    </button>
                </div>
                <div id="anchorList" class="flex flex-wrap gap-2">
                    <div class="text-center text-gray-400 py-2 w-full">暂无主播</div>
                </div>
            </div>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6" id="stats">
            <div class="stat-card animate-slide-in delay-200">
                <div class="text-white/80 text-sm mb-1">今日收入</div>
                <div class="text-3xl font-bold" id="todayIncome">¥0</div>
            </div>
            <div class="stat-card animate-slide-in delay-300">
                <div class="text-white/80 text-sm mb-1">本周收入</div>
                <div class="text-3xl font-bold" id="weekIncome">¥0</div>
            </div>
            <div class="stat-card animate-slide-in delay-400">
                <div class="text-white/80 text-sm mb-1">本月收入</div>
                <div class="text-3xl font-bold" id="monthIncome">¥0</div>
            </div>
        </div>

        <!-- Per-Anchor Statistics -->
        <div class="card p-6 mb-6 animate-slide-in delay-450">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">📊 各主播收入统计</h2>
            <div id="anchorStatsList" class="space-y-3">
                <div class="text-center text-gray-400 py-4">暂无数据</div>
            </div>
        </div>

        <!-- Add Work Record Form -->
        <div class="card p-6 mb-6 animate-slide-in delay-500">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">➕ 添加工作记录</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">主播</label>
                    <select id="anchorSelect"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                        <option value="">请选择主播</option>
                    </select>
                </div>
                <div></div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">开始时间</label>
                    <input type="datetime-local" id="startTime" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">结束时间</label>
                    <input type="datetime-local" id="endTime" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
                </div>
            </div>
            <div class="mt-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">备注（可选）</label>
                <input type="text" id="note" placeholder="例如：早班、晚班等"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none">
            </div>
            <div class="mt-4 p-4 bg-purple-50 rounded-lg">
                <div class="text-sm text-gray-600 mb-2">💡 工资计算规则：</div>
                <div class="text-sm text-gray-700">
                    • 早班 (6:00-8:00): <span class="font-semibold text-purple-600">50元/小时</span><br>
                    • 常规 (8:00-22:00): <span class="font-semibold text-indigo-600">40元/小时</span><br>
                    • 晚班 (22:00-24:00): <span class="font-semibold text-purple-600">50元/小时</span>
                </div>
            </div>
            <button type="button" id="addRecordBtn"
                    class="btn w-full mt-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-lg hover:from-green-600 hover:to-emerald-700 cursor-pointer">
                ✅ 添加记录
            </button>
        </div>

        <!-- Work Records List -->
        <div class="card p-6 animate-slide-in delay-600">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">📋 工作记录</h2>
            <div id="recordsList" class="space-y-3">
                <div class="text-center text-gray-400 py-8">暂无记录</div>
            </div>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
